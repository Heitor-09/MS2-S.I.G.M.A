<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Histórico - MS2 S.I.G.M.A</title>

    <link
      rel="stylesheet"
      href="./node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/css/style.css" />
  </head>

  <body>
    <main class="container py-5">
      <div class="text-center">
        <h1 class="fw-semibold">
          Histórico de Migués
        </h1>

        <p class="text-secondary mb-5">
          Confira seus migués favoritos e seu histórico.
        </p>
      </div>

      <section class="mb-5">
        <h2 class="h5 fw-semibold text-center mb-3">
          ⭐ Migués Favoritos
        </h2>

        <div
          id="favoritos"
          class="mx-auto"
          style="max-width: 700px;"
        ></div>
      </section>

      <hr class="my-5" />

      <section>
        <h2 class="h5 fw-semibold text-center mb-3">
          📋 Histórico
        </h2>

        <div
          id="historico"
          class="mx-auto"
          style="max-width: 700px;"
        ></div>
      </section>

      <div class="d-flex justify-content-center gap-2 mt-5 mb-5">
        <a
          href="./index.html"
          class="btn btn-primary"
        >
          Voltar
        </a>

        <button
          id="btnLimpar"
          type="button"
          class="btn btn-danger"
        >
          Limpar histórico
        </button>
      </div>
    </main>

    <footer class="text-center text-secondary small py-3">
      Desenvolvido por Vinicius Valle e Heitor Barbosa
    </footer>

    <script src="./src/js/historico.js"></script>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
